services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger_test
      POSTGRES_USER: messenger_test
      POSTGRES_PASSWORD: messenger_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger_test -d messenger_test"]
      interval: 2s
      timeout: 3s
      retries: 20
