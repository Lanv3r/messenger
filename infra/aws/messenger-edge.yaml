AWSTemplateFormatVersion: "2010-09-09"
Description: HTTPS frontend and API edge deployment for Messenger.

Parameters:
  FrontendDomainName:
    Type: String
    Description: Public hostname for the Messenger frontend.
    AllowedPattern: "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$"
  ApiDomainName:
    Type: String
    Description: Public hostname for the Messenger API.
    AllowedPattern: "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$"
  CertificateArn:
    Type: String
    Description: Issued ACM certificate ARN covering both public hostnames.
    AllowedPattern: "^arn:[a-z0-9-]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$"
  BackendOriginDomainName:
    Type: String
    Description: Existing EC2 public DNS name without a scheme or path.
    AllowedPattern: "^[a-zA-Z0-9.-]+$"

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-frontend"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Restricts the Messenger frontend bucket to CloudFront.
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Cache immutable Vite assets while respecting the index document metadata.
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        Name: !Sub "${AWS::StackName}-frontend"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref FrontendDomainName
        Comment: Messenger static frontend.
        CustomErrorResponses:
          - ErrorCachingMinTTL: 0
            ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCachingMinTTL: 0
            ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref FrontendCachePolicy
          Compress: true
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: FrontendS3Origin
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Disable caching for authenticated Messenger API and Socket.IO traffic.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        Name: !Sub "${AWS::StackName}-api"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Comment: Forward credentials and Socket.IO request data without preserving the viewer host.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - Host
        Name: !Sub "${AWS::StackName}-api"
        QueryStringsConfig:
          QueryStringBehavior: all

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref ApiDomainName
        Comment: Messenger API and Socket.IO HTTPS endpoint.
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref ApiCachePolicy
          Compress: true
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          TargetOriginId: BackendApiOrigin
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - CustomOriginConfig:
              HTTPPort: 80
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
            DomainName: !Ref BackendOriginDomainName
            Id: BackendApiOrigin
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

Outputs:
  ApiDistributionDomainName:
    Description: CloudFront hostname to use in the api DNS CNAME record.
    Value: !GetAtt ApiDistribution.DomainName
  ApiUrl:
    Description: HTTPS API base URL after the DNS CNAME record is added.
    Value: !Sub "https://${ApiDomainName}"
  FrontendBucketName:
    Description: Private S3 bucket containing the Vite build.
    Value: !Ref FrontendBucket
  FrontendDistributionDomainName:
    Description: CloudFront hostname to use in the frontend DNS CNAME record.
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: HTTPS Messenger URL after the DNS CNAME record is added.
    Value: !Sub "https://${FrontendDomainName}"
